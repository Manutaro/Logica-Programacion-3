<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Factorial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">



    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

               
                <div class="card shadow border-0 rounded-4 p-4 text-center">
                    <div class="card-body">
                        <h1 class="h3 mb-3 text-primary fw-bold">Cálculo de Factorial</h1>

                        <p class="text-muted small mb-4">
                            Revisa la consola de tu navegador (Inspeccionar o Ctrl + Shift + J) o la ventana emergente
                            para ver el resultado.
                        </p>

                        <!-- Área de resultado -->
                        <div id="resultado" class="fs-5 fw-semibold" style="color: #680148;">
                            Esperando número...
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    
    <script src="./practicaFactorial.js"></script>
</body>

</html>
